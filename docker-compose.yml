services:
  db:
    image: mysql:latest
    restart: always
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: LocalTest
      MYSQL_DATABASE: reservas
    volumes:
      - reservas:/var/lib/mysql

  valkey:
    image: valkey/valkey:latest
    restart: always
    ports:
      - "3691:6379"
    volumes:
      - valkey_data:/data

volumes:
  reservas: {}
  valkey_data: {}
